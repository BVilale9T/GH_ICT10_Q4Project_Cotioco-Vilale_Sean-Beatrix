<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <!-- CSS -->
        <link rel="stylesheet" href="SK.css">
        <!-- PyScript (older 2024 release used here for numpy/matplotlib support) -->
        <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
        <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
        <title>Skills Test</title>
        <!-- PyScript config: declare extra Python packages needed -->
        <py-config>
            packages = ["numpy", "matplotlib"]
        </py-config>
    </head>
    <body>
        <!-- Navigation Bar -->
        <header>
            <nav class="navbar navbar-expand-sm">
                <div class="container-fluid">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="mynavbar">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="../../index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="../SW/SW.html">Classmate List</a>
                            </li>
                            <li class="nav-item">
                                <!-- Active page: Attendance Tracker -->
                                <a class="nav-link active" href="#"><b>Attendance Tracker</b></a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="../Project/Project.html">Photos</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <form>
                <!-- Number of absent students for the selected month -->
                <input type="number" id="Absent" placeholder="Absent people for the month"><br>
                <!-- Dropdown to pick the month -->
                <select name="Months" id="Months">
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">November</option>
                    <option value="December">December</option>
                </select><br>
                <!-- py-click calls the Calculate function in SK.py -->
                <input type="button" py-click="Calculate" value="Generate Graph" id="Calculate">
            </form>
        </main>
        <div id="output"></div>

        <!-- Load the Python logic for this page -->
        <py-script src="SK.py"></py-script>
    </body>
</html>
